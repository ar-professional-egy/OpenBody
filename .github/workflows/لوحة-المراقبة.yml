name: لوحة مراقبة OpenBody

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: API health check
    runs-on: ubuntu-latest
    steps:
      - name: Check API endpoint configuration
        id: config
        env:
          API_URL: ${{ secrets.OPENBODY_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OPENBODY_API_URL is not configured yet; API monitoring is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check API health
        if: steps.config.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.OPENBODY_API_URL }}
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "$API_URL/health")
          test "$STATUS" = "200"
          echo "API health check passed: $STATUS"

      - name: Report pending configuration
        if: steps.config.outputs.configured != 'true'
        run: echo "Monitoring is ready; configure OPENBODY_API_URL after the FastAPI service is deployed."
